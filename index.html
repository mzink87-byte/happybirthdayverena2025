<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Verena!</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Stars -->
  <div id="stars"></div>

  <!-- Confetti + Streamers -->
  <div id="confetti-container"></div>
  <div id="streamers-container"></div>

  <!-- Header -->
  <header>
    <h1>Happy Birthday, Verena! 🎂</h1>
    <p>We love you.</p>
  </header>

  <!-- Memories Gallery -->
  <section>
    <h2>Memories</h2>
    <div class="gallery">
      <img src="IMG_5506.jpeg" alt="Family memory">
      <img src="IMG_6231.jpeg" alt="Family memory">
      <img src="IMG_6244.jpeg" alt="Family memory">
      <img src="IMG_6371.jpeg" alt="Family memory">
      <img src="image000000.jpeg" alt="Family memory">
    </div>
  </section>

  <!-- Sticky Notes -->
  <section id="stickyNotes">
    <h2>Birthday Sticky Notes</h2>
    <form id="noteForm">
      <input type="text" id="name" placeholder="Your name" required>
      <input type="text" id="note" placeholder="Write a short note (max 120)" maxlength="120" required>
      <button type="submit">Post</button>
    </form>
    <div id="notesBoard"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz">
    <h2>How Well Do You Know Verena?</h2>
    <form id="quizForm">
      <div class="question">
        <p>1. Where was Verena born?</p>
        <label><input type="radio" name="q1" value="a"> Germany</label>
        <label><input type="radio" name="q1" value="b"> Texas</label>
        <label><input type="radio" name="q1" value="c"> Italy</label>
        <label><input type="radio" name="q1" value="d"> New York</label>
      </div>

      <div class="question">
        <p>2. What is Verena’s favorite animal?</p>
        <label><input type="radio" name="q2" value="a"> Cat</label>
        <label><input type="radio" name="q2" value="b"> Dog</label>
        <label><input type="radio" name="q2" value="c"> Bird</label>
        <label><input type="radio" name="q2" value="d"> Fish</label>
      </div>

      <div class="question">
        <p>3. What was the #1 song in September 1987?</p>
        <label><input type="radio" name="q3" value="a"> "Livin' on a Prayer" — Bon Jovi</label>
        <label><input type="radio" name="q3" value="b"> "With or Without You" — U2</label>
        <label><input type="radio" name="q3" value="c"> "I Wanna Dance with Somebody" — Whitney Houston</label>
        <label><input type="radio" name="q3" value="d"> "La Bamba" — Los Lobos</label>
      </div>

      <button type="submit">Submit</button>
    </form>
    <div id="quizResult"></div>
  </section>

  <!-- Song -->
  <section id="song">
    <h2>🎶 Birthday Song</h2>
    <iframe width="560" height="315"
      src="https://www.youtube.com/embed/4ssJcMkmUUw"
      title="Happy Birthday Song"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </section>

  <!-- Footer -->
  <footer>
    <p>Made with ❤️ by Matthew</p>
  </footer>
</body>
</html>
